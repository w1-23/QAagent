<svg viewBox="0 0 1000 260" width="1000" height="260" role="img" aria-label="科研数据审查流程图：上传、表格解析、数值规则筛查、模型解释、人工复核" xmlns="http://www.w3.org/2000/svg">
  <title>科研数据审查流程</title><desc>五个顺序步骤：上传、表格解析、数值规则筛查、模型解释、人工复核。</desc><rect x="0" y="0" width="1000" height="260" fill="#ffffff" /><text x="40" y="46" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#1f2d3d">科研数据审查流程</text><defs>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="8" markerHeight="8">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c" /></marker></defs><g font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#14212e" text-anchor="middle">
    <rect x="35" y="95" width="160" height="80" rx="10" ry="10" fill="#e8f1fb" stroke="#3b6ea5" stroke-width="2" /><text x="115" y="142">上传</text><rect x="230" y="95" width="160" height="80" rx="10" ry="10" fill="#e9f5ee" stroke="#3d8b62" stroke-width="2" /><text x="310" y="142">表格解析</text><rect x="425" y="95" width="160" height="80" rx="10" ry="10" fill="#fdf3e2" stroke="#b57e28" stroke-width="2" /><text x="505" y="142">数值规则筛查</text><rect x="620" y="95" width="160" height="80" rx="10" ry="10" fill="#f1ecf9" stroke="#6b52a3" stroke-width="2" /><text x="700" y="142">模型解释</text><rect x="815" y="95" width="150" height="80" rx="10" ry="10" fill="#fdeceb" stroke="#a8453c" stroke-width="2" /><text x="890" y="142">人工复核</text></g><g stroke="#5b6b7c" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="196" y1="135" x2="226" y2="135" /><line x1="391" y1="135" x2="421" y2="135" /><line x1="586" y1="135" x2="616" y2="135" /><line x1="781" y1="135" x2="811" y2="135" /></g><text x="40" y="222" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#5b6b7c">顺序流程；每步输出供下一步使用，最终由人工判定。</text></svg>