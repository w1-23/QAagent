<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CitrusScholar 吉祥物 · 动作预览</title>
<link rel="stylesheet" href="../mascot.css">
<style>
  :root {
    --bg-surface: #fdfbf6;
    --text-1: #2b2b2b; --text-2: #555; --text-3: #8a8f96;
    --accent: #D9821B; --border-hairline: rgba(0,0,0,.10);
    --ease-out-quint: cubic-bezier(.22,1,.36,1);
  }
  body {
    margin: 0; padding: 28px 24px 40px;
    font: 14px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    color: var(--text-1);
    background: #f7f4ec;
  }
  h1 { font-size: 17px; margin: 0 0 4px; }
  .hint { color: var(--text-3); font-size: 12.5px; margin: 0 0 22px; }
  .stage {
    position: relative; height: 240px; border-radius: 16px;
    background: #fff; border: 1px solid var(--border-hairline);
    display: flex; align-items: flex-end; justify-content: center;
    padding-bottom: 26px; margin-bottom: 18px;
  }
  .input-box {
    position: relative; width: min(560px, 92%);
    border: 1px solid var(--border-hairline); border-radius: 14px;
    background: #fff; padding: 16px 14px; color: var(--text-3); font-size: 13px;
  }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  button.chip {
    padding: 6px 12px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--border-hairline); background: #fff;
    font-size: 12.5px; color: var(--text-2);
  }
  button.chip:hover { border-color: var(--accent); color: var(--accent); }
  button.chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  #log {
    font: 12px/1.7 ui-monospace, Consolas, monospace;
    background: #fff; border: 1px solid var(--border-hairline);
    border-radius: 10px; padding: 10px 12px; max-height: 160px; overflow: auto;
    color: var(--text-2); white-space: pre-wrap;
  }
</style>
</head>
<body>
  <h1>柑橘吉祥物 · 动作预览（V1 七种动作 + 拖拽）</h1>
  <p class="hint">
    状态由左侧按钮或下面的“自动演示”驱动；待机时大部分时间安静趴着，每 4–12 秒才可能眨眼。
    鼠标按住角色可以拖动，松开后播放落下。
  </p>

  <div class="stage">
    <div class="input-box">
      <div id="citrusMascot" class="citrus-mascot" data-state="idle" role="img"
           aria-label="CitrusScholar 柑橘吉祥物" title="按住可以把我拎起来">
        <span class="citrus-mascot-frame" aria-hidden="true"></span>
        <button type="button" id="mascotClose" class="citrus-mascot-close"
                title="隐藏吉祥物" aria-label="隐藏吉祥物">✕</button>
      </div>
      有什么想做的？(Enter 发送 / Shift+Enter 换行)
    </div>
  </div>

  <div class="row" id="states"></div>
  <div class="row">
    <button class="chip" id="autoBtn" type="button">自动演示：开</button>
    <button class="chip" id="resetBtn" type="button">恢复待机</button>
    <button class="chip" id="hideBtn" type="button">隐藏 / 显示</button>
  </div>
  <div id="log"></div>

<script src="../mascot.js"></script>
<script>
(function () {
  var STATES = [
    ['idle', '待机'], ['planning', '思考'], ['retrieving', '检索'],
    ['generating', '生成'], ['completed', '完成'], ['failed', '失败'],
    ['dragging', '被拎起'], ['dropping', '落下']
  ];
  var logEl = document.getElementById('log');
  var chips = {};
  var last = 'idle';

  function log(line) {
    var t = new Date().toLocaleTimeString('zh-CN', { hour12: false });
    logEl.textContent = '[' + t + '] ' + line + '\n' + logEl.textContent;
  }

  STATES.forEach(function (pair) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip';
    b.textContent = pair[1] + ' · ' + pair[0];
    b.addEventListener('click', function () {
      CitrusMascot.setState(pair[0], { force: true });
      log('手动切到 ' + pair[0]);
    });
    document.getElementById('states').appendChild(b);
    chips[pair[0]] = b;
  });

  // 记录状态变化（轮询 data-state，避免侵入组件内部）
  setInterval(function () {
    var cur = document.getElementById('citrusMascot').getAttribute('data-state');
    if (cur === last) return;
    last = cur;
    Object.keys(chips).forEach(function (k) { chips[k].classList.toggle('on', k === cur); });
    log('状态 → ' + cur);
  }, 200);

  var auto = true, autoTimer = null;
  function autoLoop() {
    if (!auto) return;
    var seq = ['planning', 'retrieving', 'generating', 'completed'];
    var i = 0;
    autoTimer = setInterval(function () {
      if (!auto) return;
      CitrusMascot.setState(seq[i % seq.length], { force: true });
      log('自动演示 → ' + seq[i % seq.length]);
      i += 1;
    }, 2200);
  }
  autoLoop();

  document.getElementById('autoBtn').addEventListener('click', function () {
    auto = !auto;
    this.textContent = '自动演示：' + (auto ? '开' : '关');
    if (auto) autoLoop(); else if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
  });
  document.getElementById('resetBtn').addEventListener('click', function () {
    auto = false;
    document.getElementById('autoBtn').textContent = '自动演示：关';
    if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
    CitrusMascot.setState('idle', { force: true });
    log('恢复待机');
  });
  document.getElementById('hideBtn').addEventListener('click', function () {
    CitrusMascot.toggle();
    log('切换显示：' + (document.getElementById('citrusMascot').classList.contains('is-hidden') ? '隐藏' : '显示'));
  });
})();
</script>
</body>
</html>
