[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "citrusscholar-support"
version = "2.0.0"
description = "Explicit, independently usable research support for CitrusScholar"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
dependencies = []

[project.optional-dependencies]
refcheck = ["httpx>=0.27", "requests>=2.31", "openpyxl>=3.1"]
retrieval = ["numpy>=2", "lancedb==0.37.1", "requests>=2.31"]
retrieval-cpu = ["fastembed==0.8.0"]
retrieval-gpu = ["fastembed-gpu==0.8.0"]
retrieval-models = ["optimum==2.1.0", "optimum-onnx==0.1.0", "transformers==4.57.6"]
documents = ["python-docx>=1.2,<2", "pdfplumber>=0.10", "python-calamine>=0.2"]
audit = ["numpy>=2", "pandas>=2", "openpyxl>=3.1"]
figures = ["numpy>=2", "pandas>=2", "matplotlib>=3.7", "PyMuPDF>=1.26,<2"]
statistics = ["scipy>=1.11", "statsmodels>=0.14"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["packages"]
include = ["citrus_retrieval*", "citrus_refcheck*", "citrus_audit*", "citrus_figures*"]
exclude = ["*.tests", "*.tests.*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.yaml", "*.md"]

[tool.pytest.ini_options]
testpaths = ["packages", "skills"]
python_files = ["*_test.py", "test_*.py"]
addopts = "-p no:cacheprovider"
