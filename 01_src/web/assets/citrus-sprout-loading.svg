<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="轻轻摇动的绿色双叶小芽">
  <path d="M15 49 Q32 46 49 49" stroke="#6AA77B" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M32 47.3 Q31.6 39.8 32 32" stroke="#398A58" stroke-width="2.5" stroke-linecap="round"/>
  <g class="leaf-left">
    <path d="M31.8 35 C21.2 35.4 16.7 29.2 16.8 22.8 C25.7 22.7 30.5 27.5 31.8 35 Z" stroke="#398A58" stroke-width="2.2" stroke-linejoin="round"/>
  </g>
  <g class="leaf-right">
    <path d="M32 33.8 C32.3 23.2 39.4 18.9 47.3 18.5 C46.8 28 40.6 33.6 32 33.8 Z" stroke="#398A58" stroke-width="2.2" stroke-linejoin="round"/>
  </g>
  <style>
    .leaf-left {transform-origin:32px 35px;animation:left-sway 3.5s ease-in-out infinite}
    .leaf-right {transform-origin:32px 34px;animation:right-sway 4.1s ease-in-out infinite}
    @keyframes left-sway {0%,100%{transform:rotate(0deg)}45%{transform:rotate(-5deg)}70%{transform:rotate(2deg)}}
    @keyframes right-sway {0%,100%{transform:rotate(0deg)}38%{transform:rotate(5deg)}72%{transform:rotate(-2deg)}}
    @media (prefers-reduced-motion:reduce){.leaf-left,.leaf-right{animation:none}}
  </style>
</svg>
