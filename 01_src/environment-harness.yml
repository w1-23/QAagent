# Optional migration-validation environment, not the full CPU/GPU service stack.
# Create from 01_src: conda env create -f environment-harness.yml
# On machines with a stale proxy, set process NO_PROXY for the mirror hosts first.
name: CitrusSchalor
channels:
  - https://mirrors.tuna.tsinghua.edu.cn/anaconda/pkgs/main
  - nodefaults
dependencies:
  - python=3.13.18
  - pip=26.2.2
  - pip:
      - --index-url https://pypi.tuna.tsinghua.edu.cn/simple
      - -r requirements-harness.lock.txt
variables:
  NO_PROXY: pypi.tuna.tsinghua.edu.cn,mirrors.tuna.tsinghua.edu.cn
  PYTHONUTF8: '1'
